# 4. Deploy Stage
- stage: Deploy
  displayName: "Deploy Container Apps"
  dependsOn:
    - Build
  variables:
    # Reference output from Build job
    IMAGE_TAG: $[ stageDependencies.Build.Build.outputs['SetEnvs.imageTag'] ]
  condition: |
      and(
        succeeded(),
        ne(variables['Build.Reason'], 'PullRequest'),
        in(variables['Build.SourceBranchName'], 'develop', 'staging', 'main')
      )
  jobs:
    - deployment: DeployToEnv
      displayName: Deploy Container App
      environment: $(env)

      strategy:
        runOnce:
          deploy:
            steps:
            - task: AzureCLI@2
              displayName: "Deploy all apps"
              inputs:
                azureSubscription: "$(AZURE_SUBSCRIPTION_SERVICE_CONNECTION)"
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  echo "Deploying image: $(IMAGE_NAME):$IMAGE_TAG"

                  az containerapp update \
                    --name $(env)-app \
                    --resource-group $(env)-rg \
                    --container-name api \
                    --image "$(ACR_NAME).azurecr.io/$(IMAGE_NAME):$IMAGE_TAG"

