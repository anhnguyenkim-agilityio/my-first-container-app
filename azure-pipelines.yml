trigger:
  branches:
    include:
      - develop
      - staging
      - main

pr:
  branches:
    include:
      - "*"

variables:
  - name: ACR_NAME
    value: "dratiniacr"

  - name: IMAGE_NAME
    value: "dratini"

  - name: GITHUB_SERVICE_CONNECTION
    value: "github.com_anhnguyenkim-agilityio"

  - name: AZURE_SUBSCRIPTION_SERVICE_CONNECTION
    value: "AzureConnection"

  - name: env
    value: 'dev'   # default fallback

  - ${{ if eq(variables['Build.SourceBranchName'], 'develop') }}:
    - name: env
      value: 'dev'

  - ${{ if eq(variables['Build.SourceBranchName'], 'staging') }}:
    - name: env
      value: 'stag'

  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    - name: env
      value: 'prod'

pool:
  name: Default

resources:
  repositories:
  - repository: self
    type: github
    name: $(GITHUB_SERVICE_CONNECTION)/my-first-container-app

stages:
# 1. Build Stage
- stage: Build
  displayName: Build & Push Image
  jobs:
  - job: Build
    steps:
    # Set IMAGE_TAG and RG_NAME
    - bash: |
        SHORT_SHA=$(echo $(Build.SourceVersion) | cut -c1-7)
        IMAGE_TAG="$(env)-$SHORT_SHA"
        echo "Image tag: $IMAGE_TAG"

        echo "##vso[task.setvariable variable=imageTag;isOutput=true]$IMAGE_TAG"
        echo "##vso[task.setvariable variable=envName;isOutput=true]$ENV_NAME"
      name: SetEnvs
      displayName: "Set image tag"

    # Login to ACR
    - task: AzureCLI@2
      displayName: "Login to ACR"
      inputs:
        azureSubscription: "$(AZURE_SUBSCRIPTION_SERVICE_CONNECTION)"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(ACR_NAME)

    - bash: |
        echo "Building image: $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(SetEnvs.imageTag)"
        docker build -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(SetEnvs.imageTag) .
        docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(SetEnvs.imageTag)
      displayName: "Build & Push Docker Image"

