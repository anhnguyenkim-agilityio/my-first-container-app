trigger:
  branches:
    include:
      - main

variables:
  - name: ACR_NAME
    value: "f2kwkhdb8vhvacr"
  - name: IMAGE_NAME
    value: "samples/hello-world"

  - name: GITHUB_SERVICE_CONNECTION
    value: "github.com_anhnguyenkim-agilityio"

  - name: AZURE_SUBSCRIPTION_SERVICE_CONNECTION
    value: "AzureConnection"

  - name: containerApps
    value: "dev-app"

pool:
  name: Default

resources:
  repositories:
  - repository: self
    type: github
    name: $(GITHUB_SERVICE_CONNECTION)/my-first-container-app

stages:
# Build and push image
- stage: Build
  displayName: Build & Push to ACR
  jobs:
  - job: Build
    steps:
    # Set IMAGE_TAG and RG_NAME
    - bash: |
        echo "Branch name: $(Build.SourceBranchName)"
        # Detect environment from branch
        if [ "$(Build.SourceBranchName)" = "main" ]; then
          ENV_NAME="dev"
        elif [ "$(Build.SourceBranchName)" = "staging" ]; then
          ENV_NAME="staging"
        else
          ENV_NAME="dev"
        fi

        SHORT_SHA=$(echo $(Build.SourceVersion) | cut -c1-7)
        IMAGE_TAG="${ENV_NAME}-$SHORT_SHA"
        echo "Image tag: $IMAGE_TAG"

        echo "##vso[task.setvariable variable=imageTag;isOutput=true]$IMAGE_TAG"
        echo "##vso[task.setvariable variable=envName;isOutput=true]$ENV_NAME"
      name: SetEnvs
      displayName: "Set image tag"

    # Login to ACR
    - task: AzureCLI@2
      displayName: "Login to ACR"
      inputs:
        azureSubscription: "$(AZURE_SUBSCRIPTION_SERVICE_CONNECTION)"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(ACR_NAME)

    - bash: |
        echo "Building image: $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(SetEnvs.imageTag)"
        docker build -t $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(SetEnvs.imageTag) .
        docker push $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(SetEnvs.imageTag)
      displayName: "Build & Push Docker Image"

# - stage: Test
#   displayName: Run Tests
#   dependsOn: Build
#   jobs:
#   - job: RunTests
#     steps:
#       - bash: |
#           echo "Running tests..."
#         displayName: "Run Unit/Integration Tests"

- stage: Migrate
  displayName: Run Django Migrations Job
  dependsOn: Build
  jobs:
    - job: RunMigrationJob
      variables:
        # Reference output from Build job
        ENV_NAME: $[ stageDependencies.Build.Build.outputs['SetEnvs.envName'] ]
      steps:
        - task: AzureCLI@2
          displayName: "Run Django Migration Job"
          inputs:
            azureSubscription: "$(AZURE_SUBSCRIPTION_SERVICE_CONNECTION)"
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              echo "Starting migration job..."
              az containerapp job start \
                --name django-migrate-job \
                --resource-group $ENV_NAME-rg

              echo "Waiting for job to finish..."

              # Fetch job execution status until 'Completed'
              JOB_EXEC_ID=$(az containerapp job execution list \
                --name django-migrate-job \
                --resource-group $ENV_NAME-rg \
                --query "[0].name" -o tsv)

              while true; do
                STATUS=$(az containerapp job execution show \
                  --name django-migrate-job \
                  --resource-group $ENV_NAME-rg \
                  --job-execution-name $JOB_EXEC_ID \
                  --query "properties.status" -o tsv)

                echo "Job status: $STATUS"

                if [ "$STATUS" = "Succeeded" ]; then
                  echo "Migration job succeeded."
                  break
                fi

                if [ "$STATUS" = "Failed" ]; then
                  echo "Migration job FAILED."
                  exit 1
                fi

                sleep 5
              done

- stage: Deploy
  displayName: "Deploy Container Apps"
  dependsOn: Migrate
  jobs:
    - job: Deploy
      variables:
        # Reference output from Build job
        IMAGE_TAG: $[ stageDependencies.Build.Build.outputs['SetEnvs.imageTag'] ]
        ENV_NAME: $[ stageDependencies.Build.Build.outputs['SetEnvs.envName'] ]
      steps:
      - task: AzureCLI@2
        displayName: "Deploy all apps"
        inputs:
          azureSubscription: "$(AZURE_SUBSCRIPTION_SERVICE_CONNECTION)"
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            echo "Deploying image: $(IMAGE_NAME):$IMAGE_TAG"

            az containerapp update \
              --name $ENV_NAME-app \
              --resource-group $ENV_NAME-rg \
              --container-name api \
              --image "$(ACR_NAME).azurecr.io/$(IMAGE_NAME):$IMAGE_TAG"

            az containerapp update \
              --name $ENV_NAME-app \
              --resource-group $ENV_NAME-rg \
              --container-name worker \
              --image "$(ACR_NAME).azurecr.io/$(IMAGE_NAME):$IMAGE_TAG"
