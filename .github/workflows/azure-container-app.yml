name: Azure Coontainer Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    env:
      ENV: local
      ACR_NAME: anhnguyenkimacr
      CONTAINER_APP_NAME: local-api
      RESOURCE_GROUP: local-rg
      IMAGE_NAME: samples/hello-world
      LOCATION: westus2

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Login to Azure with SP credentials
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: false

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: anhnguyenkimacr.azurecr.io
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}
          containerAppName: local-api
          resourceGroup: local-rg
          imageToBuild: anhnguyenkimacr.azurecr.io/samples/hello-world:${{ ENV }}
